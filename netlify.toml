[build]
  # Copies the site into _site/ and generates the Articles section from
  # content/articles/*.md. See PUBLISHING.md.
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/articles/"
  to = "/articles.html"
  status = 301

[[redirects]]
  from = "/articles"
  to = "/articles.html"
  status = 301
